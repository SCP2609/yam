<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YAM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <style>
    body { max-width: 900px; margin: 3rem auto; font: 16px system-ui; background: #10131a; color: #e8edf7; }
    button, input, select { padding: .55rem; margin: .2rem; }
    section { padding: 1rem; margin: 1rem 0; background: #1b2230; border-radius: 8px; }
    .plugin { display: flex; gap: .5rem; align-items: center; border-top: 1px solid #344; padding: .6rem 0; }
    .plugin span { flex: 1; }
    small { color: #aab; }
    dialog { width: min(900px, 96vw); height: min(650px, 85vh); background: #10131a; color: #e8edf7; border: 1px solid #567; }
    #terminal { height: calc(100% - 2.5rem); }
    #upload-status { color: #aab; }
  </style>
</head>
<body>
  <h1>YAM</h1>
  <p id="device"></p>
  <section>
    <h2>Пакеты</h2>
    <form id="upload"><input id="package-file" type="file" name="package" accept=".yap" required><button>Установить .yap</button><small id="upload-status"></small></form>
    <div id="plugins"></div>
  </section>
  <section>
    <h2>LED</h2>
    <input id="colors" value="#4285F4,#EA4335,#FBBC05" size="40">
    <button onclick="setLed()">Показать</button>
    <button onclick="turnOff()">Выключить</button>
  </section>
  <section>
    <h2>Настройки</h2>
    <label>Профиль <select id="profile" onchange="syncCount()"><option>mini2</option><option>micro</option><option>midi</option><option>plum</option><option>sysfs-ring</option><option>custom</option></select></label>
    <label>LED count <input id="count" type="number" min="1" max="128"></label>
    <label><input id="binaries" type="checkbox"> Разрешить бинарники плагинов</label>
    <label><input id="updates" type="checkbox"> Автообновление YAM из GitHub Releases</label>
    <button onclick="saveSettings()">Сохранить</button>
  </section>
  <dialog id="terminal-dialog"><button onclick="closeTerminal()">Закрыть</button><div id="terminal"></div></dialog>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script>
const api = '/api';
const terminalDialog = document.getElementById('terminal-dialog');
const terminalElement = document.getElementById('terminal');
async function request(path, options) {
  const response = await fetch(api + path, options);
  if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || response.statusText);
  return response;
}
function pluginRow(plugin) {
  const { manifest, enabled, running, compatible, incompatibility } = plugin;
  const run = compatible ? (running ? 'Перезапустить' : 'Запустить') : 'Несовместим';
  const disabled = compatible ? '' : `disabled title="${incompatibility}"`;
  const stop = running ? `<button onclick="action('${manifest.id}', 'stop')">Остановить</button>` : '';
  const terminal = manifest.launch.kind === 'binary' && manifest.launch.mode === 'oneshot' ? `<button ${disabled} onclick="openTerminal('${manifest.id}')">Терминал</button>` : '';
  return `<div class="plugin"><span><b>${manifest.name}</b> <small>${manifest.id} · ${manifest.version}<br>${manifest.description || ''}</small></span><button onclick="action('${manifest.id}', 'toggle')">${enabled ? 'Выключить' : 'Включить'}</button><button ${disabled} onclick="action('${manifest.id}', 'invoke')">${run}</button>${terminal}${stop}<button onclick="action('${manifest.id}', 'delete')">Удалить</button></div>`;
}
async function load() {
  try {
    const [pluginData, settings, currentDevice] = await Promise.all([request('/plugins').then(r => r.json()), request('/settings').then(r => r.json()), request('/device').then(r => r.json())]);
    device.textContent = `Колонка: ${currentDevice.model} · ${currentDevice.architecture} · ${currentDevice.features.join(', ')}`;
    plugins.innerHTML = pluginData.map(pluginRow).join('') || 'Пакетов нет';
    profile.value = settings.led.profile;
    count.value = settings.led.count;
    binaries.checked = settings.allow_plugin_binaries;
    updates.checked = settings.updates.enabled;
  } catch (error) { alert(error.message); }
}
async function action(id, name) {
  try { await request(`/plugins/${id}${name === 'delete' ? '' : `/${name}`}`, { method: name === 'delete' ? 'DELETE' : 'POST' }); await load(); } catch (error) { alert(error.message); }
}
upload.onsubmit = async event => {
  event.preventDefault();
  const file = packageFile.files[0];
  if (!file) return;
  if (file.size > 64 * 1024 * 1024) return alert('Пакет больше 64 МиБ');
  uploadStatus.textContent = `Загрузка ${file.name}…`;
  try { const form = new FormData(); form.append('package', file, file.name); await request('/plugins', { method: 'POST', body: form }); upload.reset(); await load(); uploadStatus.textContent = 'Установлено'; } catch (error) { uploadStatus.textContent = ''; alert(error.message); }
};
let terminalSocket, terminalInstance;
function openTerminal(id) {
  terminalDialog.showModal();
  terminalElement.innerHTML = '';
  terminalInstance = new Terminal({ cursorBlink: true, theme: { background: '#10131a' } });
  terminalInstance.open(terminalElement);
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  terminalSocket = new WebSocket(`${scheme}://${location.host}${api}/plugins/${encodeURIComponent(id)}/terminal`);
  terminalSocket.binaryType = 'arraybuffer';
  terminalSocket.onmessage = event => terminalInstance.write(typeof event.data === 'string' ? event.data : new TextDecoder().decode(event.data));
  terminalSocket.onerror = () => terminalInstance.writeln('\r\nНе удалось открыть терминал.');
  terminalSocket.onclose = () => terminalInstance.writeln('\r\nПроцесс завершён.');
  terminalInstance.onData(data => { if (terminalSocket.readyState === WebSocket.OPEN) terminalSocket.send(data); });
  terminalInstance.attachCustomKeyEventHandler(event => {
    if (event.type !== 'keydown' || terminalSocket.readyState !== WebSocket.OPEN) return true;
    if ((event.ctrlKey || event.metaKey) && event.key.length === 1) {
      const code = event.key.toUpperCase().charCodeAt(0) - 64;
      if (code >= 1 && code <= 26) { terminalSocket.send(String.fromCharCode(code)); return false; }
    }
    if (event.altKey && !event.ctrlKey && event.key.length === 1) {
      terminalSocket.send(`\x1b${event.key}`); return false;
    }
    return true;
  });
}
function closeTerminal() { if (terminalSocket) terminalSocket.close(); if (terminalInstance) terminalInstance.dispose(); terminalDialog.close(); }
function ringColors() { const list = colors.value.split(',').map(c => c.trim()).filter(Boolean); return list.length ? Array.from({ length: Number(count.value) || list.length }, (_, i) => list[i % list.length]) : list; }
async function setLed() { try { await request('/led', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ colors: ringColors() }) }); } catch (error) { alert(error.message); } }
async function turnOff() { try { await request('/led/off', { method: 'POST' }); } catch (error) { alert(error.message); } }
const ZONE_COUNTS = { mini2: 6, micro: 3, midi: 24, plum: 3 };
function syncCount() {
  const zones = ZONE_COUNTS[profile.value];
  if (zones) count.value = zones;
}
async function saveSettings() {
  try { syncCount(); const settings = await request('/settings').then(r => r.json()); settings.led.profile = profile.value; settings.led.count = Number(count.value); settings.allow_plugin_binaries = binaries.checked; settings.updates.enabled = updates.checked; await request('/settings', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(settings) }); } catch (error) { alert(error.message); }
}
load();
</script>
</body>
</html>
