name: Release

on:
  push:
    tags: ["yam-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build speaker CLI and publish release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      YAM_UPDATE_PUBLIC_KEY: ${{ vars.YAM_UPDATE_PUBLIC_KEY }}
      YAM_UPDATE_SIGNING_KEY: ${{ secrets.YAM_UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Determine release version
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "yam") | .version')
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then tag="${GITHUB_REF_NAME}"; else tag="yam-v${version}"; fi
          [[ "$tag" == "yam-v${version}" ]] || { echo "Tag $tag does not match Cargo.toml version $version" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate source
        run: |
          cargo fmt --check
          cargo test --locked
          sh -n install.sh
      - name: Build AArch64 musl speaker CLI
        run: >-
          docker run --rm
          -e YAM_UPDATE_PUBLIC_KEY
          -v "$GITHUB_WORKSPACE":/home/rust/src
          -w /home/rust/src
          messense/rust-musl-cross:aarch64-musl
          cargo build --release --locked --bin yam
      - name: Create release
        run: |
          test -n "$YAM_UPDATE_PUBLIC_KEY" || { echo "YAM_UPDATE_PUBLIC_KEY repository variable is required" >&2; exit 1; }
          test -n "$YAM_UPDATE_SIGNING_KEY" || { echo "YAM_UPDATE_SIGNING_KEY repository secret is required" >&2; exit 1; }
          mkdir dist
          cp target/aarch64-unknown-linux-musl/release/yam dist/yam-aarch64-unknown-linux-musl
          chmod 0755 dist/yam-aarch64-unknown-linux-musl
          sha256=$(sha256sum dist/yam-aarch64-unknown-linux-musl | awk '{print $1}')
          size=$(stat --printf='%s' dist/yam-aarch64-unknown-linux-musl)
          artifact="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/yam-aarch64-unknown-linux-musl"
          jq -nc --arg version "${{ steps.version.outputs.version }}" --arg artifact "$artifact" --arg sha256 "$sha256" --argjson size "$size" \
            '{format:1,version:$version,target:"aarch64-unknown-linux-musl",artifact:$artifact,sha256:$sha256,size:$size}' > dist/yam-update.json
          cargo run --quiet --locked --bin yam-sign-update -- --key "$YAM_UPDATE_SIGNING_KEY" dist/yam-update.json dist/yam-update.json.sig
          (cd dist && sha256sum yam-aarch64-unknown-linux-musl > SHA256SUMS)
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/yam-aarch64-unknown-linux-musl dist/yam-update.json dist/yam-update.json.sig dist/SHA256SUMS \
            --title "YAM ${{ steps.version.outputs.version }}" --generate-notes
